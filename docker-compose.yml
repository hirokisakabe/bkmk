services:
  db:
    image: postgres:17-alpine
    container_name: bkmk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bkmk
    ports:
      - '5432:5432'
    volumes:
      - bkmk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bkmk']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bkmk-db-data:
